<!-- RSVP Confirmation Modal Overlay -->
<div id="rsvp-modal" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-on-background/40 backdrop-blur-sm transition-all duration-300 hidden">
    <div class="relative w-full max-w-sm bg-white/90 backdrop-blur-xl rounded-xl shadow-[0_20px_50px_rgba(122,85,85,0.12)] p-stack-lg text-center overflow-hidden border border-white/60 animate-in fade-in zoom-in duration-300">
        <!-- Top Gradient Accent -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary-container/40 via-primary/30 to-primary-container/40"></div>
        
        <!-- Close button in corner -->
        <button onclick="closeRsvpModal()" class="absolute top-4 right-4 text-outline hover:text-primary transition-colors focus:outline-none">
            <span class="material-symbols-outlined">close</span>
        </button>

        <!-- Decorative Floral Corner -->
        <div class="absolute -top-4 -left-4 opacity-20 pointer-events-none transform -rotate-12">
            <span class="material-symbols-outlined text-6xl text-primary-container" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                eco
            </span>
        </div>

        <!-- Heart/Broken Heart Icon -->
        <div class="mb-stack-md flex justify-center floating-animation">
            <span id="rsvp-modal-icon" class="material-symbols-outlined text-primary-container text-7xl" style="font-variation-settings: 'FILL' 1;">
                favorite
            </span>
        </div>

        <!-- Heading -->
        <h2 id="rsvp-modal-title" class="font-headline-md text-headline-md text-primary mb-stack-sm tracking-tight">
            ¡Gracias por confirmar!
        </h2>

        <!-- Message Body -->
        <p id="rsvp-modal-description" class="font-body-md text-body-md text-on-surface-variant mb-stack-lg leading-relaxed px-2">
            Nos hace muy felices saber que nos acompañarás en este día tan especial para celebrar la llegada de <span class="font-semibold text-primary italic">Adhara</span>.
        </p>

        <!-- Action Button -->
        <button onclick="closeRsvpModal()" class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-4 px-6 rounded-full transition-all duration-300 ease-out shadow-md active:scale-95 focus:outline-none">
            Volver al Inicio
        </button>

        <!-- Decorative Clouds (Bottom Right) -->
        <div class="absolute -bottom-6 -right-6 opacity-10 pointer-events-none">
            <span class="material-symbols-outlined text-8xl text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 100;">
                cloud
            </span>
        </div>
    </div>
</div>
